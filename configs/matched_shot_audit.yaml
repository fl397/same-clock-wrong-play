# MATCHED-SHOT / COMMON-SAMPLE CHECK — specified before any result exists.
# Scope: a common-sample check of the Figure 1 spacing/eFG comparison. No new estimand, no filter change,
# no spacing/timing/quartile redefinition, no 3PA claim, no regression.
analysis_id: MATCHED_SHOT_COMMON_SAMPLE_v1
source_artifact: results/external_artifact_generalization.csv   # the spacing/eFG comparison
source_producer: src/external_artifact_generalization.py       # unchanged, re-run only to regenerate the per-shot cache
per_shot_cache: data/spacing_at_shot_generalization.parquet     # regenerated by the unchanged producer
reproduction_gate:
  rule: "the regenerated aggregate CSV must equal the shipped spacing/eFG table — n per (axis, quartile) exactly, efg / mean_hull / share_3pt to 1e-9 — before any per-shot row is read"
  on_fail: STOP; report; no matched-shot result
original_values:
  games: 437 (CLOCK_CALIBRATION_VALIDATED)
  naive: {n: 27563, quartile_n: [6891, 6890, 6891, 6891], efg: [0.4779, 0.5267, 0.5443, 0.5718], q4_minus_q1: 0.0938}
  calibrated: {n: 64764, quartile_n: [16191, 16191, 16191, 16191], efg: [0.5243, 0.4977, 0.4910, 0.5055], q4_minus_q1: -0.0188}
shot_identity_key: [game_id, period, secs, shot_value, made]   # the producer's per-shot row identity; axis in {naive, calibrated}; no actionNumber exists in the rows; no fuzzy matching
duplicate_keys:
  rule: "a key that occurs more than once within an axis is excluded from S_intersection (it cannot be matched one-to-one); the count is reported per axis"
common_sample:
  S_intersection: "keys present on BOTH axes after duplicate exclusion (naive-window eligibility >= 5 labelled frames AND corrected-window eligibility >= 5 labelled frames); no additional filtering"
  spacing_per_shot: "the two hull_area values already computed by the spacing producer for that key: naive-window hull and corrected-window hull"
quartiles:
  rule: "per axis separately, boundaries = 25/50/75 % quantiles of that axis's hull_area over S_intersection (pandas quantile, numpy digitize, exactly as the producer); all common shots assigned"
  outcome: "efg = (made + 0.5 * made * [shot_value == 3]) / n, exactly as the producer"
  report: [n_by_quartile, efg_by_quartile, q4_minus_q1, spearman_rho_over_quartile_means]
secondary_fixed_rank_check:
  rule: "quartiles assigned ONCE by naive hull_area ranks on S_intersection; within those memberships report naive eFG by quartile and corrected-window hull mean/median by the same groups; diagnostic only; not promoted"
decision_rule:   # 'substantially' operationalised here, before results
  reference: naive Q4-Q1 on the ORIGINAL naive sample = 0.0938
  CASE_1_MATCHED_SAMPLE_CONFIRMS_ARTIFACT: "naive Q4-Q1 on S_intersection >= 2/3 * 0.0938 (= 0.0625) AND naive quartile eFGs monotone non-decreasing Q1..Q4 on S_intersection AND corrected Q4-Q1 on S_intersection <= 1/3 of the naive Q4-Q1 on S_intersection (or negative) — current headline remains defensible"
  CASE_3_SAMPLE_COMPOSITION_DOMINATES: "naive Q4-Q1 on S_intersection < 1/3 * 0.0938 (= 0.0313) — the Figure 1 headline would not be supported"
  CASE_2_MIXED_MEASUREMENT_AND_SELECTION: "otherwise — public wording becomes 'Naive clock joining alters both analytical eligibility and the apparent spacing–efficiency relationship.'; correction alone may not be said to 'remove' the gradient"
outputs: [docs/validation/MATCHED_SHOT_VALIDATION.md, results/matched_shot_audit.csv, results/matched_shot_audit.json]
